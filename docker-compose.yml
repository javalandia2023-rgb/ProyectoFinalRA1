version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: proyecto-final-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ProyectoFinalDB
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: ProyectoFinal.API/Dockerfile
    container_name: proyecto-final-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__MySqlConnection=Server=mysql-db;Port=3306;Database=ProyectoFinalDB;User=root;Password=root;AllowUserVariables=True;UseAffectedRows=False;DefaultCommandTimeout=300;
      - PersistenceMode=MySQL
    ports:
      - "5168:8080"
    depends_on:
      mysql-db:
        condition: service_healthy

volumes:
  mysql_data:
